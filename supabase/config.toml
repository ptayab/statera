# Minimal Supabase CLI config for migration automation (CI) and local `supabase db push`.
# Project is linked via `supabase link` or SUPABASE_PROJECT_REF in GitHub Actions.
project_id = "statera"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
enabled = true

[studio]
enabled = true
port = 54323
